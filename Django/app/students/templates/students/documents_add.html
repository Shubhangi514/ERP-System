{% extends "students/base_auth.html" %}
{% block title %}Add Document · EduTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8 col-xl-7">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb" style="background:transparent;padding:0;font-size:.83rem;">
        <li class="breadcrumb-item">
          <a href="{% url 'documents_list' %}" style="color:var(--primary);">
            <i class="bi bi-file-earmark-text me-1"></i>Documents
          </a>
        </li>
        <li class="breadcrumb-item active">Add New</li>
      </ol>
    </nav>

    <div class="card">
      <div class="card-header">
        <div class="d-flex align-items-center gap-3">
          <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;">
            <i class="bi bi-file-earmark-plus" style="color:#fff;font-size:1.1rem;"></i>
          </div>
          <div>
            <h4 class="mb-0">Upload Document</h4>
            <p class="mb-0" style="font-size:.8rem;color:var(--muted);">Add document for a student (paste Google Drive share link)</p>
          </div>
        </div>
      </div>

      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-4">
            <!-- Student -->
            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-people me-1"></i>Select Student <span style="color:#f87171;">*</span>
              </label>
              <select class="form-select" name="student_id" required>
                <option value="" disabled selected>Choose student…</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.name }} ({{ student.email }})</option>
                {% endfor %}
              </select>
            </div>

            <!-- Document Type -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-tag me-1"></i>Document Type <span style="color:#f87171;">*</span>
              </label>
              <select class="form-select" name="doc_type" required>
                <option value="" disabled selected>Select type…</option>
                <option value="ID">ID Proof</option>
                <option value="FORM">Form</option>
                <option value="MEDICAL">Medical Record</option>
                <option value="OTHER">Other</option>
              </select>
            </div>

            <!-- Document File -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-file-earmark-pdf me-1"></i>Upload File (PDF/Doc) <span style="color:#f87171;">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-upload"></i></span>
                <input type="file" class="form-control" name="document_file" accept=".pdf,.doc,.docx,.txt" required>
              </div>
              <div class="form-text">Max size: 5MB. PDF, DOCX, TXT allowed.</div>
            </div>
          </div>

          <hr class="divider my-4">

          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'documents_list' %}" class="btn btn-outline-light">
              <i class="bi bi-x me-1"></i>Cancel
            </a>
            <button type="submit" class="btn btn-success px-4">
              <i class="bi bi-cloud-upload me-1"></i>Upload Document
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
