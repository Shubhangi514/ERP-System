{% extends "students/base_auth.html" %}
{% block title %}Add Assignment · EduTrack{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8 col-xl-7">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb" style="background:transparent;padding:0;font-size:.83rem;">
        <li class="breadcrumb-item">
          <a href="{% url 'assignments_list' %}" style="color:var(--primary);">
            <i class="bi bi-journal-text me-1"></i>Assignments
          </a>
        </li>
        <li class="breadcrumb-item active">Add New</li>
      </ol>
    </nav>

    <div class="card">
      <div class="card-header">
        <div class="d-flex align-items-center gap-3">
          <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;">
            <i class="bi bi-journal-plus" style="color:#fff;font-size:1.1rem;"></i>
          </div>
          <div>
            <h4 class="mb-0">Add Assignment</h4>
            <p class="mb-0" style="font-size:.8rem;color:var(--muted);">Record student assignment submission</p>
          </div>
        </div>
      </div>

      <div class="card-body">
        <form method="POST">
          {% csrf_token %}
          <div class="row g-4">
            <!-- Student -->
            <div class="col-12">
              <label class="form-label">
                <i class="bi bi-people me-1"></i>Select Student <span style="color:#f87171;">*</span>
              </label>
              <select class="form-select" name="student_id" required>
                <option value="" disabled selected>Choose student…</option>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.name }} ({{ student.course }})</option>
                {% endfor %}
              </select>
            </div>

            <!-- Subject -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-book me-1"></i>Subject <span style="color:#f87171;">*</span>
              </label>
              <select class="form-select" name="subject" required>
                <option value="" disabled selected>— Select Subject —</option>
                {% for sub in subject_options %}
                <option value="{{ sub }}">{{ sub }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- File Link -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-link-45deg me-1"></i>File Link <span style="color:#f87171;">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text">🔗</span>
                <input type="url" class="form-control" name="file_link" placeholder="https://drive.google.com/…" required>
              </div>
              <div class="form-text">Google Drive share link (Anyone with link access)</div>
            </div>

            <!-- Status -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-circle-half me-1"></i>Status
              </label>
              <select class="form-select" name="status">
                <option value="PENDING">Pending</option>
                <option value="SUBMITTED">Submitted</option>
                <option value="GRADED">Graded</option>
              </select>
            </div>

            <!-- Score (optional) -->
            <div class="col-12 col-md-6">
              <label class="form-label">
                <i class="bi bi-star me-1"></i>Score (Optional)
              </label>
              <div class="input-group">
                <input type="number" class="form-control" name="score" min="0" max="100" step="0.1" placeholder="e.g. 85">
                <span class="input-group-text">/100</span>
              </div>
            </div>
          </div>

          <hr class="divider my-4">

          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'assignments_list' %}" class="btn btn-outline-light">
              <i class="bi bi-x me-1"></i>Cancel
            </a>
            <button type="submit" class="btn btn-warning px-4">
              <i class="bi bi-journal-check me-1"></i>Save Assignment
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
