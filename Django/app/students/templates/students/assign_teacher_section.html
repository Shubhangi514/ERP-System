{% extends 'students/base_auth.html' %}
{% block title %}Assign Teacher – {{ section }} – EduTrack Pro{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h1 style="font-size:1.75rem;font-weight:800;margin:0;">
    <i class="bi bi-person-plus me-2" style="color:#34d399;"></i>Assign Teacher to {{ section }}
  </h1>
  <a href="{% url 'section_detail' section.pk %}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Teacher</label>
            <select name="teacher_id" class="form-select" required>
              <option value="">— Select Teacher —</option>
              {% for t in teachers %}
              <option value="{{ t.pk }}">{{ t.name }} ({{ t.subject }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label">Subject to Teach</label>
            <select name="subject" class="form-select" required>
              <option value="">— Select Subject —</option>
              {% for s in subjects %}
              <option value="{{ s }}">{{ s }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-person-check-fill me-1"></i> Assign Teacher
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
