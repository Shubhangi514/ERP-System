{% extends 'students/base_auth.html' %}
{% block title %}Create Section – EduTrack Pro{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h1 style="font-size:1.75rem;font-weight:800;margin:0;"><i class="bi bi-plus-circle me-2" style="color:#22d3ee;"></i>Create Section</h1>
  <a href="{% url 'section_list' %}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header"><h4><i class="bi bi-grid-3x3-gap me-2" style="color:#22d3ee;"></i>New Section</h4></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Class</label>
            <select name="class_name" class="form-select" required>
              <option value="">— Select Class —</option>
              {% for c in class_options %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Section</label>
            <select name="section" class="form-select" required>
              {% for code, label in section_choices %}
              <option value="{{ code }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label">Capacity</label>
            <input type="number" name="capacity" class="form-control" value="40" min="1" max="100">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-circle-fill me-1"></i> Create Section
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
